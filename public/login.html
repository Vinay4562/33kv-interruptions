<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, private">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #00b4db, #0083b0);
            margin: 0;
            color: #333;
            padding-top: 120px;
        }

        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: #fff;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 100px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .header-content {
            display: flex;
            align-items: center;
            flex-grow: 1;
        }

        .header .logo {
            width: 130px;
            height: auto;
            margin-left: 30px;
        }

        .header h1 {
            margin: 0;
            color: red;
            font-size: 35px;
            font-weight: 600;
            font-family: 'Roboto', sans-serif;
            margin-left: 20px;
            white-space: nowrap;
        }

        .hamburger {
            display: none;
            font-size: 30px;
            background: none;
            border: none;
            color: #333;
            cursor: pointer;
            margin-right: 20px;
        }

        .navbar {
            display: flex;
            justify-content: center;
            background: transparent;
            padding: 10px 0;
            position: fixed;
            top: 100px;
            width: 100%;
            z-index: 1000;
            transition: all 0.3s ease;
        }

        .navbar a {
            color: #fff;
            text-decoration: none;
            padding: 15px 25px;
            font-size: 16px;
            font-weight: 500;
            transition: background-color 0.3s, color 0.3s;
            text-align: center;
        }

        .navbar a:hover,
        .navbar a.active {
            background-color: #0056b3;
            color: #fff;
            border-radius: 4px;
        }

        /* Mobile Menu Overlay */
        .navbar.active {
            display: block;
            position: fixed;
            top: 0;
            right: 0;
            width: 250px;
            height: 100vh;
            background-color: rgba(255, 255, 255, 0.95);
            padding: 60px 20px 20px;
            box-shadow: -2px 0 10px rgba(0, 0, 0, 0.3);
        }

        .navbar.active a {
            display: block;
            margin: 15px 0;
            text-align: left;
            color: #333;
        }

        .navbar.active a:hover {
            background-color: #007bff;
            color: #fff;
        }

        .close-btn {
            display: none;
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            background: none;
            border: none;
            color: #333;
            cursor: pointer;
        }

        .navbar.active .close-btn {
            display: block;
        }

        .container {
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.2);
            padding: 20px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
            margin: 120px auto;
            transition: transform 0.3s ease-in-out;
        }

        .container:hover {
            transform: scale(1.03);
        }

        h1:not(.header h1) {
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .message {
            margin: 15px 0;
            padding: 15px;
            border-radius: 8px;
            font-size: 14px;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 12px 15px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-size: 16px;
            transition: border-color 0.3s ease, box-shadow 0.3s ease;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            border-color: #007bff;
            box-shadow: 0 0 8px rgba(0, 123, 255, 0.3);
            outline: none;
        }

        .password-container {
            position: relative;
        }

        .toggle-visibility {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #007bff;
            font-size: 18px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #007bff;
            border: none;
            color: #fff;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
        }

        button:hover {
            background: #0056b3;
        }

        button:active {
            background: #004085;
            transform: translateY(2px);
        }

        /* Media Queries for Responsiveness */
        @media (max-width: 768px) {
            .header h1 {
                font-size: 25px;
                margin-left: 15px;
            }

            .header h1::before {
                content: "TG TRANSCO";
            }

            .hamburger {
                display: block;
            }

            .navbar {
                display: none;
            }

            .navbar.active {
                display: block;
            }

            .container {
                width: 80%;
                max-width: 300px;
                margin: 100px auto;
                padding: 15px;
            }

            .header .logo {
                width: 100px;
                margin-left: 15px;
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: 20px;
                margin-left: 10px;
            }

            .header .logo {
                width: 80px;
                margin-left: 10px;
            }

            .hamburger {
                font-size: 24px;
            }

            .container {
                width: 75%;
                max-width: 280px;
                padding: 10px;
            }

            h1:not(.header h1) {
                font-size: 24px;
            }

            .navbar.active {
                width: 200px;
            }
        }

        @media (min-width: 769px) {
            .header h1::before {
                content: "𝐓𝐑𝐀𝐍𝐒𝐌𝐈𝐒𝐒𝐈𝐎𝐍 𝐂𝐎𝐑𝐏𝐎𝐑𝐀𝐓𝐈𝐎𝐍 𝐎𝐅 𝐓𝐄𝐋𝐀𝐍𝐆𝐀𝐍𝐀 𝐋𝐈𝐌𝐈𝐓𝐄𝐃";
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <img src="logo_new.png" alt="Logo" class="logo">
            <h1></h1>
        </div>
        <button class="hamburger">☰</button>
    </header>

    <div class="navbar">
        <button class="close-btn">✕</button>
        <a href="https://33kv-interruptions.vercel.app/InterruptionDashboard.html">33KV Interruptions Dashboard</a>
        <a href='https://eht-trippings-git-main-vinay-kumars-projects-f1559f4a.vercel.app/login.html'>EHT Trippings</a>
        <a href='https://eht-trippings-git-main-vinay-kumars-projects-f1559f4a.vercel.app/data_extraction.html'>EHT Trippings Dashboard</a>
    </div>

    <div class="container">
        <h1>Login</h1>
        <div class="message error" id="login-error" style="display: none;"></div>
        <div class="message success" id="login-success" style="display: none;"></div>
        <form id="login-form">
            <input type="text" id="username" name="username" placeholder="Username" required>
            <div class="password-container">
                <input type="password" id="password" name="password" placeholder="Password" required>
                <i class="fas fa-eye toggle-visibility" id="toggle-password"></i>
            </div>
            <button type="submit">Login</button>
        </form>
    </div>

    <script>
        // Toggle Hamburger Menu
        document.querySelector('.hamburger').addEventListener('click', function() {
            document.querySelector('.navbar').classList.toggle('active');
        });

        // Close Hamburger Menu
        document.querySelector('.close-btn').addEventListener('click', function() {
            document.querySelector('.navbar').classList.remove('active');
        });

        document.getElementById('login-form').addEventListener('submit', function (event) {
            event.preventDefault();
    
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
    
            fetch('/login', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ username, password })
            })
            .then(response => response.json())
            .then(data => {
                const errorDiv = document.getElementById('login-error');
                const successDiv = document.getElementById('login-success');
    
                errorDiv.style.display = 'none';
                successDiv.style.display = 'none';
    
                if (data.success) {
                    successDiv.textContent = 'Login successful!';
                    successDiv.style.display = 'block';
                    document.getElementById('username').value = '';
                    document.getElementById('password').value = '';
                    sessionStorage.setItem('substationName', data.substation);
                    window.location.href = `/interruption.html?substation=${encodeURIComponent(data.substation)}`;
                } else {
                    errorDiv.textContent = 'Wrong username or password. Please try again.';
                    errorDiv.style.display = 'block';
                }
            })
            .catch(error => {
                console.error('Login error:', error);
                const errorDiv = document.getElementById('login-error');
                errorDiv.textContent = 'An error occurred during login. Please try again later.';
                errorDiv.style.display = 'block';
            });
        });

        // Password visibility toggle
        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('toggle-password');

        togglePassword.addEventListener('click', () => {
            const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
            passwordInput.setAttribute('type', type);
            togglePassword.classList.toggle('fa-eye');
            togglePassword.classList.toggle('fa-eye-slash');
        });

        // Clear form fields on page load
        document.addEventListener('DOMContentLoaded', function () {
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
        });

        // Prevent back navigation
        window.history.pushState(null, null, window.location.href);
        window.addEventListener('popstate', function () {
            window.history.pushState(null, null, window.location.href);
        });
    </script>
</body>
</html>
